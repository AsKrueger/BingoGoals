<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BingoGoals</title>

<style>
  :root { --paper: #fbf5e9; --ink: #1f1a14; --muted: #5d5447; --stamp: #c8102e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --paper: #16130f; --ink: #ede1d2; --muted: #c9bba8; --stamp: #ff6b6f; color-scheme: dark; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px max(18px, env(safe-area-inset-left)); }
  h1 { font-size: 44px; line-height: 1.05; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .02em; }
  h1 span { color: var(--stamp); }
  p { color: var(--muted); }
  a { color: var(--stamp); }
</style>
</head>
<body>
<main>
  <h1>BingoGoals<span>.</span></h1>
  <p>Convierte tus metas en un cartón de bingo: sella cada meta que cumplas, canta línea y celebra el cartón completo. Muy pronto en Google Play.</p>
  <p><a href="privacidad/">Política de privacidad</a> · <a href="privacidad/#english">Privacy policy</a></p>
</main>
